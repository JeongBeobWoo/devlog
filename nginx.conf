server {
    listen 80;
    server_name devlog.bubblestone.net;

    # HTTPS 리다이렉트 (SSL 설정 후 주석 해제)
    # return 301 https://$host$request_uri;

    # 정적 파일은 dist/client에서 직접 서빙
    root /home/bubble/devlog/dist/client;

    # 정적 파일 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /sitemap-index.xml {
        try_files $uri =404;
    }

    # SSR 요청 (admin 등)은 Node.js로 프록시
    location / {
        try_files $uri $uri/ @nodejs;
    }

    location @nodejs {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
