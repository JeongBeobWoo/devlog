name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GISCUS_REPO: JeongBeobWoo/devlog
          GISCUS_REPO_ID: R_kgDOU1-Zlw
          GISCUS_CATEGORY_ID: DIC_kwDOU1-Zl84DGxRr
        run: npm run build

      - name: Restart PM2
        run: |
          if pm2 list | grep -q "devlog"; then
            pm2 restart devlog
          else
            pm2 start dist/server/entry.mjs --name devlog --env production
            pm2 save
          fi

      - name: Start nginx container
        run: |
          if docker ps | grep -q "devlog-nginx"; then
            docker compose restart nginx
          else
            docker compose up -d nginx
          fi

      - name: Done
        run: echo "✅ Deploy complete"
