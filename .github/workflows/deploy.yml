name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/devlog

            # 최신 코드 pull
            git pull origin main

            # 의존성 설치 (변경된 경우만)
            npm ci --prefer-offline 2>/dev/null || npm install

            # 빌드
            npm run build

            # PM2로 재시작 (없으면 시작)
            if pm2 list | grep -q "devlog"; then
              pm2 restart devlog
            else
              pm2 start dist/server/entry.mjs --name devlog --env production
              pm2 save
            fi

            echo "✅ Deploy complete"
