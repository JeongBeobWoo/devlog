name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd ~/devlog
          git pull origin main

      - name: Install dependencies
        run: |
          cd ~/devlog
          npm ci

      - name: Build
        run: |
          cd ~/devlog
          npm run build

      - name: Restart PM2
        run: |
          cd ~/devlog
          pm2 delete devlog 2>/dev/null || true
          pm2 start ecosystem.config.cjs --env production
          pm2 save

      - name: Done
        run: echo "✅ Deploy complete"
