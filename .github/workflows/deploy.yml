name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd ~/devlog
          cp src/data/techmap.json /tmp/techmap.json.bak 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/techmap.json.bak src/data/techmap.json 2>/dev/null || true

      - name: Install dependencies
        run: |
          cd ~/devlog
          npm ci

      - name: Build
        run: |
          cd ~/devlog
          npm run build

      - name: Restart PM2
        run: |
          cd ~/devlog
          pm2 delete devlog 2>/dev/null || true
          pm2 start ecosystem.config.cjs --env production
          pm2 save

      - name: Done
        run: echo "✅ Deploy complete"
